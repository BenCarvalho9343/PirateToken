<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortnite One Piece Chest Clicker</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      min-height: 100vh;
    }

    .game {
      min-height: 100vh;
      position: relative;
    }

    .counter {
      margin: 0;
      padding: 22px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .chest-area {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .chest-button {
      display: block;
      width: min(280px, 70vw);
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transition: transform 0.05s ease;
    }

    .chest-button:active {
      transform: scale(0.98);
    }

    .chest-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .chest-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .banner {
      position: fixed;
      top: 0;
      left: 50%;
      z-index: 2;
      width: min(560px, calc(100% - 24px));
      padding: 20px;
      transform: translate(-50%, -100%);
      background: #111;
      color: #fff;
      text-align: center;
      font-weight: 700;
      box-sizing: border-box;
      transition: transform 0.2s ease;
    }

    .reward-text {
      display: block;
    }

    .reward-image {
      display: block;
      width: 104px;
      height: 104px;
      margin: 12px auto 0;
      object-fit: contain;
    }

    .banner.visible {
      transform: translate(-50%, 0);
    }

    .inventory-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      border: 1px solid #111;
      border-radius: 6px;
      padding: 10px 14px;
      background: #fff;
      color: #111;
      cursor: pointer;
      font-weight: 700;
    }

    .inventory {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.94);
    }

    .inventory[hidden] {
      display: none;
    }

    .inventory-panel {
      width: min(420px, 100%);
      border: 1px solid #111;
      padding: 24px;
      background: #fff;
      box-sizing: border-box;
    }

    .inventory-panel h2 {
      margin: 0 0 18px;
    }

    .auto-status {
      margin: -8px 0 16px;
      color: #0a6b2b;
      font-weight: 700;
    }

    .inventory-list {
      margin: 0 0 20px;
      padding: 0;
      list-style: none;
    }

    .inventory-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    .inventory-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inventory-item-image {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .inventory-item-details {
      display: grid;
      gap: 2px;
    }

    .inventory-item-details small {
      color: #555;
      font-size: 0.75rem;
    }

    .close-inventory {
      border: 1px solid #111;
      padding: 8px 12px;
      background: #111;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="counter">Chests opened: <span id="clickCount">0</span></p>
    <div id="dropBanner" class="banner" role="status" aria-live="polite"></div>

    <div class="chest-area">
      <button id="chestButton" class="chest-button" type="button" aria-label="Open chest">
        <img class="chest-image" src="chest.jpg" alt="Treasure chest" />
      </button>
    </div>

    <button id="inventoryButton" class="inventory-button" type="button" hidden>Inventory</button>
    <section id="inventory" class="inventory" hidden aria-labelledby="inventoryTitle">
      <div class="inventory-panel">
        <h2 id="inventoryTitle">Inventory</h2>
        <p id="autoStatus" class="auto-status" role="status" hidden>Auto mode activated</p>
        <ul id="inventoryList" class="inventory-list"></ul>
        <button id="closeInventory" class="close-inventory" type="button">Close</button>
      </div>
    </section>
  </main>

  <script>
    const drops = [
      { name: 'Weekly Gold Outfit', odds: 1562500 },
      { name: 'Pirate Shop Access', odds: 137500 },
      { name: 'Weekly Vehicle and Decal', odds: 7813 },
      { name: 'Weekly Pickaxe', odds: 1136 },
      { name: 'Weekly Back Bling', odds: 1136 },
      { name: 'Weekly Jam Track', odds: 391 },
      { name: 'Weekly Loading Screen', odds: 272 },
      { name: 'Golden Firework', odds: 381 },
      { name: 'Portable Extractor', odds: 381 },
      { name: 'Extraction Accelerator', odds: 381 },
      { name: 'Sprite Locator', odds: 381 }
    ];

    const clickCountElement = document.getElementById('clickCount');
    const dropBanner = document.getElementById('dropBanner');
    const chestButton = document.getElementById('chestButton');
    const inventoryButton = document.getElementById('inventoryButton');
    const inventory = document.getElementById('inventory');
    const inventoryList = document.getElementById('inventoryList');
    const closeInventory = document.getElementById('closeInventory');
    const autoStatus = document.getElementById('autoStatus');

    let clickCount = 0;
    let bannerTimeout;
    let autoClicker;
    let typedSequence = '';
    const collectedDrops = new Map();
    const autoClickInterval = 10;

    function stopAutoClicker() {
      clearInterval(autoClicker);
      autoClicker = undefined;
      typedSequence = '';
      autoStatus.hidden = true;
    }

    function rollDrop() {
      return drops.filter((drop) => Math.floor(Math.random() * drop.odds) === 0);
    }

    chestButton.addEventListener('click', () => {
      clickCount += 1;
      clickCountElement.textContent = clickCount;

      const wonDrops = rollDrop();
      if (wonDrops.length === 0) {
        return;
      }

      wonDrops.forEach((drop) => {
        const collected = collectedDrops.get(drop.name);
        collectedDrops.set(drop.name, {
          count: (collected?.count || 0) + 1,
          firstFoundAt: collected?.firstFoundAt || clickCount
        });
      });

      inventoryButton.hidden = false;
      dropBanner.innerHTML = `<span class="reward-text">You got: ${wonDrops.map((drop) => drop.name).join(', ')}</span><img class="reward-image" src="token.png" alt="" />`;
      dropBanner.classList.add('visible');
      chestButton.disabled = true;
      clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => {
        dropBanner.classList.remove('visible');
        chestButton.disabled = false;
      }, 3000);
    });

    inventoryButton.addEventListener('click', () => {
      inventoryList.replaceChildren();
      collectedDrops.forEach(({ count, firstFoundAt }, name) => {
        const item = document.createElement('li');
        item.innerHTML = `<span class="inventory-item"><img class="inventory-item-image" src="token.png" alt="" /><span class="inventory-item-details"><span>${name}</span><small>Found after ${firstFoundAt} chests</small></span></span><strong>${count}</strong>`;
        inventoryList.appendChild(item);
      });
      inventory.hidden = false;
    });

    document.addEventListener('keydown', (event) => {
      if (inventory.hidden) {
        return;
      }

      if (event.key.length !== 1 || event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }

      typedSequence = `${typedSequence}${event.key.toLowerCase()}`.slice(-4);
      if (typedSequence !== 'auto' || autoClicker) {
        return;
      }

      autoStatus.hidden = false;
      autoClicker = setInterval(() => chestButton.click(), autoClickInterval);
    });

    document.addEventListener('click', (event) => {
      if (event.isTrusted && autoClicker) {
        stopAutoClicker();
      }
    });

    closeInventory.addEventListener('click', () => {
      inventory.hidden = true;
      stopAutoClicker();
    });
  </script>
</body>
</html>
